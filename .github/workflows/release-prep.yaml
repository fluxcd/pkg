name: release-prep

on:
  push:
    branches:
      - main
      - 'flux/v2.*.x'

jobs:
  prep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cmd/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Run make prep-ci
        run: make prep-ci
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        with:
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          commit-message: Prepare for release
          committer: GitHub <noreply@github.com>
          signoff: true
          branch: release-${{ github.ref_name }}
          title: Prepare for release
          body: |
            Automated release preparation for `${{ github.ref_name }}`.
